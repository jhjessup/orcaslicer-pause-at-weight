# Weekly check that OrcaSlicer still has every plugin API name pause_at_weight.py uses.
# A failure means OrcaSlicer renamed or removed something: update the plugin and tests/fake_orca.py.
name: OrcaSlicer API check

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:       # "Run workflow" button on the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look for each API name in OrcaSlicer's plugin source
        run: |
          base=https://raw.githubusercontent.com/OrcaSlicer/OrcaSlicer/main/src/slic3r/plugin
          curl -fsS "$base/PythonPluginBridge.cpp" \
                    "$base/pluginTypes/slicingPipeline/SlicingPipelinePluginCapability.cpp" > api.txt
          status=0
          for name in plugin base register_capability register_capabilities ExecutionResult \
                      success failure PluginResult RecoverableError get_name get_default_config \
                      get_config slicing Step psGCodePostProcess SlicingPipelineCapabilityBase \
                      execute step gcode_path; do
            grep -qF "\"$name\"" api.txt || { echo "Missing from OrcaSlicer: $name"; status=1; }
          done
          exit $status
